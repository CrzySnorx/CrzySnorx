<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f55f4">
  <title>Aral Tayo – Learn Filipino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body class="auth-body">
  <button class="icon-btn theme-btn theme-float" type="button" data-theme-toggle aria-label="Toggle dark mode">🌙</button>
  <main class="auth-wrap">
    <section class="auth-hero">
      <div class="sun" aria-hidden="true">☀</div>
      <h1>Aral Tayo</h1>
      <p class="tagline">Learn Filipino (Tagalog) — one friendly lesson at a time.</p>
      <ul class="hero-points">
        <li>🗣 Hear every word spoken aloud</li>
        <li>🃏 Flashcards that remember what you know</li>
        <li>🧠 Quizzes to test yourself</li>
        <li>📈 Track your XP and daily streak</li>
      </ul>
    </section>

    <section class="auth-card">
      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-login" role="tab" type="button">Log in</button>
        <button class="tab" id="tab-register" role="tab" type="button">Create account</button>
      </div>

      <form id="login-form" novalidate>
        <label>Username
          <input type="text" id="login-username" autocomplete="username" required>
        </label>
        <label>Password
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <p class="form-error" id="login-error" role="alert"></p>
        <button class="btn primary block" type="submit">Log in</button>
        <button class="btn ghost block" type="button" id="demo-btn">Try the demo account</button>
      </form>

      <form id="register-form" class="hidden" novalidate>
        <label>Your name
          <input type="text" id="reg-name" autocomplete="name" required>
        </label>
        <label>Username
          <input type="text" id="reg-username" autocomplete="username" required>
        </label>
        <label>Where are you from? <span class="opt">(optional)</span>
          <input type="text" id="reg-country" placeholder="e.g. Japan">
        </label>
        <label>Password <span class="opt">(min 6 characters)</span>
          <input type="password" id="reg-password" autocomplete="new-password" required>
        </label>
        <label>Confirm password
          <input type="password" id="reg-confirm" autocomplete="new-password" required>
        </label>
        <p class="form-error" id="reg-error" role="alert"></p>
        <button class="btn primary block" type="submit">Create account</button>
      </form>

      <p class="small muted center">Demo account: <b>demo</b> / <b>demo123</b><br>Accounts are stored only in this browser.</p>
    </section>
  </main>

  <script src="store.js"></script>
  <script src="auth.js"></script>
  <script>
    if (Auth.currentUser()) location.replace('app.html');

    if (!Store.persistent) {
      const note = document.createElement('p');
      note.className = 'form-error center small';
      note.textContent = '⚠️ Your browser is blocking storage. You can still log in, but your account lasts only while this tab stays open. Open the files directly in Chrome, Edge or Firefox to keep your account and progress.';
      document.querySelector('.auth-card').appendChild(note);
    }

    const $ = id => document.getElementById(id);
    function showTab(which) {
      const login = which === 'login';
      $('tab-login').classList.toggle('active', login);
      $('tab-register').classList.toggle('active', !login);
      $('login-form').classList.toggle('hidden', !login);
      $('register-form').classList.toggle('hidden', login);
    }
    $('tab-login').onclick = () => showTab('login');
    $('tab-register').onclick = () => showTab('register');

    $('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      $('login-error').textContent = '';
      const res = await Auth.login($('login-username').value, $('login-password').value);
      if (res.ok) location.href = 'app.html';
      else $('login-error').textContent = res.error;
    });

    $('register-form').addEventListener('submit', async e => {
      e.preventDefault();
      $('reg-error').textContent = '';
      if ($('reg-password').value !== $('reg-confirm').value) {
        $('reg-error').textContent = 'Passwords do not match.';
        return;
      }
      const res = await Auth.register({
        name: $('reg-name').value,
        username: $('reg-username').value,
        country: $('reg-country').value,
        password: $('reg-password').value
      });
      if (res.ok) location.href = 'app.html';
      else $('reg-error').textContent = res.error;
    });

    $('demo-btn').onclick = async () => {
      await Auth.ensureDemo();
      const res = await Auth.login('demo', 'demo123');
      if (res.ok) location.href = 'app.html';
    };
    Auth.ensureDemo();
  </script>
</body>
</html>
