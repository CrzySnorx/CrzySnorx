<section class="settings-section">
  <div class="section-header">
    <h2>System Settings</h2>
  </div>

  <div class="settings-grid">
    <!-- Profile -->
    <div class="profile-card">
      <img src="https://i.pravatar.cc/120" alt="Administrator Profile">
      <h3>Administrator</h3>
      <p>Livestock Yard Management System</p>
      <button class="primary-btn">
        Edit Profile
      </button>
    </div>

    <!-- Settings -->
    <div class="setting-card">
      <h3>Dashboard Options</h3>
      <br>
      <button id="darkModeBtn" class="primary-btn">
        🌙 Toggle Dark Mode
      </button>
      <br><br>
      <button id="exportCSV" class="primary-btn">
        Export CSV
      </button>
      <br><br>
      <button id="exportExcel" class="primary-btn">
        Export Excel
      </button>
      <br><br>
      <button id="exportPDF" class="primary-btn">
        Export PDF
      </button>
    </div>

    <!-- Date -->
    <div class="setting-card">
      <h3>Current Date &amp; Time</h3>
      <br>
      <h1 id="clock"></h1>
      <h3 id="today"></h3>
    </div>
  </div>
</section>
