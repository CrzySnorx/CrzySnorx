<section class="hauling-section">
  <div class="section-header">
    <h2>Hauling Schedule</h2>
    <button id="addHaulingBtn" class="primary-btn">
      <i class="fa-solid fa-plus"></i> Add Schedule
    </button>
  </div>

  <input type="text" id="searchHauling" class="search-user" placeholder="Search hauling schedule...">

  <table id="haulingTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Truck</th>
        <th>Driver</th>
        <th>Destination</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Dynamic rows -->
    </tbody>
  </table>
</section>
