<h1>Dashboard</h1>

<!-- Statistics Cards -->
<div class="cards">
  <div class="card">
    <i class="fa-solid fa-egg"></i>
    <h2 id="livestockCount">0</h2>
    <p>Total Livestock</p>
  </div>

  <div class="card">
    <i class="fa-solid fa-warehouse"></i>
    <h2 id="occupancy">0%</h2>
    <p>Yard Occupancy</p>
  </div>

  <div class="card">
    <i class="fa-solid fa-truck"></i>
    <h2 id="haulingCount">0</h2>
    <p>Today's Hauling</p>
  </div>

  <div class="card">
    <i class="fa-solid fa-money-bill-wave"></i>
    <h2 id="earnings">₱0</h2>
    <p>Today's Earnings</p>
  </div>
</div>

<!-- Chart + Schedule -->
<div class="dashboard-grid">
  <div class="chart-box">
    <h3>Yard Occupancy</h3>
    <canvas id="yardChart"></canvas>
  </div>

  <div class="schedule-box">
    <h3>Hauling Schedule</h3>
    <table>
      <thead>
        <tr>
          <th>Truck</th>
          <th>Destination</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="scheduleBody">
        <!-- Walang laman muna -->
      </tbody>
    </table>
  </div>
</div>

<!-- Recent Activities -->
<div class="activities">
  <h3>Recent Activities</h3>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Activity</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="activityBody">
      <!-- Walang laman muna -->
    </tbody>
  </table>
</div>
