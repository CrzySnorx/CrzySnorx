<div class="users-section">
  <div class="section-header">
    <h2>Users Management</h2>
    <button id="addUserBtn" class="primary-btn">
      <i class="fa-solid fa-plus"></i> Add User
    </button>
  </div>

  <input type="text" id="searchUser" placeholder="Search user..." class="search-user">

  <table id="userTable">
    <thead>

        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Dynamic rows -->
    </tbody>
  </table>
</div>
