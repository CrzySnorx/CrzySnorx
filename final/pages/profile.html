<div class="profile-container">
  <h2>Admin Profile</h2>
  <p class="subtitle">Manage your personal information and security details.</p>
  <hr class="divider">

  <form id="profileForm">
    <!-- Profile Picture Section -->
    <div class="avatar-section">
      <img src="images/admin.jpg" alt="Admin Avatar" id="avatarPreview">
      <div>
        <label for="avatarUpload" class="btn-secondary">
          <i class="fa-solid fa-camera"></i> Change Photo
        </label>
        <input type="file" id="avatarUpload" accept="image/*" style="display: none;">
      </div>
    </div>

    <!-- Personal & Organizational Info Inputs -->
    <div class="form-group">
      <label for="profileId">Admin ID</label>
      <input type="text" id="profileId" value="ADM-2026-001" disabled style="background-color: #f1f5f9; cursor: not-allowed;">
    </div>

    <div class="form-group">
      <label for="profileName">Full Name</label>
      <input type="text" id="profileName" value="Aethan Dave Manzano" placeholder="Enter full name" required>
    </div>

    <div class="form-group">
      <label for="profileEmail">Email Address</label>
      <input type="email" id="profileEmail" value="admin@livestock.com" placeholder="Enter email" required>
    </div>

    <div class="form-group">
      <label for="profilePhone">Phone Number</label>
      <input type="text" id="profilePhone" value="+63 912 345 6789" placeholder="Enter phone number">
    </div>

    <div class="form-group">
      <label for="profilePosition">Position / Designation</label>
      <input type="text" id="profilePosition" value="Yard Operations Manager" placeholder="Enter position">
    </div>

    <div class="form-group">
      <label for="profileDepartment">Department</label>
      <input type="text" id="profileDepartment" value="Operations & Management" placeholder="Enter department">
    </div>

    <div class="form-group">
      <label for="profileRole">System Access Role</label>
      <input type="text" id="profileRole" value="Super Admin" disabled style="background-color: #f1f5f9; cursor: not-allowed;">
    </div>

    <div class="form-group">
      <label for="profileAddress">Office / Station Address</label>
      <input type="text" id="profileAddress" value="Lipa City Livestock Yard Facility, Batangas" placeholder="Enter office address">
    </div>

    <button type="submit" class="btn-primary">
      <i class="fa-solid fa-floppy-disk"></i> Save Changes
    </button>
  </form>
</div>
