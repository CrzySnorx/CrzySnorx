<section class="fleet-section">
  <!-- Section Header -->
  <div class="section-header">
    <h2>Fleet Management</h2>
    <div class="header-actions">
      <button id="addVehicleBtn" class="primary-btn">
        <i class="fa-solid fa-plus"></i> Add Vehicle
      </button>
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="summary-cards">
    <div class="card">
      <div class="card-info">
        <span>Total Vehicles</span>
        <h3 id="totalFleet">0</h3>
      </div>
      <i class="fa-solid fa-truck-front card-icon"></i>
    </div>
    <div class="card">
      <div class="card-info">
        <span>Active / On-Road</span>
        <h3 id="activeFleet">0</h3>
      </div>
      <i class="fa-solid fa-circle-check card-icon healthy"></i>
    </div>
    <div class="card">
      <div class="card-info">
        <span>Under Maintenance</span>
        <h3 id="maintenanceFleet">0</h3>
      </div>
      <i class="fa-solid fa-wrench card-icon warning"></i>
    </div>
  </div>

  <!-- Toolbar & Table -->
  <div class="toolbar">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchFleet" class="search-user" placeholder="Search plate no, vehicle type, driver...">
    </div>
    <div class="filters">
      <select id="filterFleetStatus" class="filter-select">
        <option value="">All Statuses</option>
        <option value="Active">Active</option>
        <option value="Maintenance">Maintenance</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
  </div>

  <div class="table-container">
    <table id="fleetTable">
      <thead>
        <tr>
          <th>Plate Number</th>
          <th>Vehicle Type</th>
          <th>Capacity</th>
          <th>Assigned Driver</th>
          <th>Last Service Date</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Dynamic Fleet Rows -->
      </tbody>
    </table>
  </div>
</section>
