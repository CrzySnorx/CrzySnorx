<section class="earnings-section">
  <div class="section-header">
    <h2>Earnings Management</h2>
    <button id="addEarningBtn" class="primary-btn">
      <i class="fa-solid fa-plus"></i> Add Transaction
    </button>
  </div>

  <div class="earnings-summary">
    <div class="summary-card">
      <h3>Total Earnings</h3>
      <h1 id="totalEarnings">₱0.00</h1>
    </div>
  </div>

  <input type="text" id="searchEarnings" class="search-user" placeholder="Search transaction...">

  <table id="earningsTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Date</th>
        <th>Description</th>
        <th>Category</th>
        <th>Payment</th>
        <th>Amount</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Dynamic rows -->
    </tbody>
  </table>
</section>
