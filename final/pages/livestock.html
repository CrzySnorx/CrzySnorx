<section class="livestock-section">
  <div class="section-header">
    <h2>Livestock Management</h2>
    <button class="primary-btn" id="addLivestockBtn">
      <i class="fa-solid fa-plus"></i> Add Livestock
    </button>
  </div>

  <input type="text" id="searchLivestock" class="search-user" placeholder="Search livestock...">

  <table id="livestockTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Tag No.</th>
        <th>Breed</th>
        <th>Gender</th>
        <th>Weight</th>
        <th>Status</th>
        <th>Arrival</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Dynamic rows -->
    </tbody>
  </table>
</section>
