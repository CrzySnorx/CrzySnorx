<section class="page-section livestock-section" id="livestockPage">
  <!-- Header -->
  <div class="section-header">
    <h2><i class="fa-solid fa-drumstick-bite"></i> Chicken Inventory Management</h2>
    <div class="header-actions">
      <button class="secondary-btn" id="exportBtn">
        <i class="fa-solid fa-file-export"></i> Export
      </button>
      <button class="primary-btn" id="addLivestockBtn">
        <i class="fa-solid fa-plus"></i> Add Chicken
      </button>
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="summary-cards grid-4">
    <div class="card">
      <div class="card-info">
        <span>Total Chickens</span>
        <h3 id="totalLivestockCount">0</h3>
      </div>
      <i class="fa-solid fa-drumstick-bite card-icon"></i>
    </div>
    <div class="card">
      <div class="card-info">
        <span>Fresh / Good</span>
        <h3 id="healthyCount">0</h3>
      </div>
      <i class="fa-solid fa-check-circle card-icon healthy"></i>
    </div>
    <div class="card">
      <div class="card-info">
        <span>In Storage</span>
        <h3 id="quarantineCount">0</h3>
      </div>
      <i class="fa-solid fa-box-archive card-icon warning"></i>
    </div>
    <div class="card">
      <div class="card-info">
        <span>Ready for Delivery</span>
        <h3 id="readyHaulingCount">0</h3>
      </div>
      <i class="fa-solid fa-truck card-icon info"></i>
    </div>
  </div>

  <!-- Chicken Table -->
  <div class="table-container">
    <div class="table-responsive">
      <table id="livestockTable" class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Batch No.</th>
            <th>Type</th>
            <th>Weight (kg)</th>
            <th>Status</th>
            <th>Processing Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>

<!-- Add Chicken Batch Modal -->
<div id="addChickenModal" class="modal">
  <div class="modal-content">
    <!-- Header -->
    <div class="modal-header">
      <h3><i class="fa-solid fa-plus-circle"></i> Add Chicken Batch</h3>
      <button type="button" class="close-btn" onclick="closeModal('addChickenModal')">&times;</button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <form id="chickenForm">
        <div class="modal-grid">
          <div class="form-group full-width">
            <label for="batchNo">Batch No.</label>
            <input type="text" id="batchNo" placeholder="Enter Batch No." required />
          </div>

          <div class="form-group">
            <label for="chickenType">Type</label>
            <select id="chickenType" required>
              <option value="Broiler">Broiler</option>
              <option value="Layer">Layer</option>
              <option value="Native">Native</option>
            </select>
          </div>

          <div class="form-group">
            <label for="avgWeight">Average Weight (kg)</label>
            <input type="number" id="avgWeight" step="0.01" placeholder="Enter Weight" required />
          </div>

          <div class="form-group">
            <label for="chickenStatus">Status</label>
            <select id="chickenStatus" required>
              <option value="Fresh / Good">Fresh / Good</option>
              <option value="In Storage">In Storage</option>
              <option value="Ready for Delivery">Ready for Delivery</option>
            </select>
          </div>

          <div class="form-group">
            <label for="processingDate">Processing Date</label>
            <input type="date" id="processingDate" required />
          </div>
        </div>
      </form>
    </div>

    <!-- Footer Actions -->
    <div class="modal-actions">
      <button type="button" class="secondary-btn" onclick="closeModal('addChickenModal')">Cancel</button>
      <button type="button" class="primary-btn" id="saveChickenBatch">Save</button>
    </div>
  </div>
</div>
