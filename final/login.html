<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.I.Y.A.H.E Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="background"></div>

<div class="container-fluid vh-100">

<div class="row h-100 justify-content-center align-items-center">

<div class="col-lg-4 col-md-6 col-sm-10">

<div class="login-card shadow">

<h1 class="page-title">

</h1>

<div class="logo">

<img src="images/BIYAHE-2.jpg" class="img-fluid">

</div>

<h1 class="system-name">
B.I.Y.A.H.E.
</h1>

<p class="system-description">
Bathan's Integrated Yard Operations
<br>
Automated and Hauling Earning System
</p>

<form>

<div class="input-group mb-3">

<span class="input-group-text">

<i class="bi bi-person-fill"></i>

</span>

<input
type="text"
class="form-control"
placeholder="Username">

</div>

<div class="input-group mb-3">

<span class="input-group-text">

<i class="bi bi-lock-fill"></i>

</span>

<input
type="password"
id="password"
class="form-control"
placeholder="Password">

<button
class="btn btn-outline-secondary"
type="button"
onclick="togglePassword()">

<i id="eye" class="bi bi-eye-slash-fill"></i>

</button>

</div>

<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<input type="checkbox">

Remember me

</div>

<a href="#" class="forgot">

Forgot Password?

</a>

</div>

<button class="btn login-btn">

LOGIN

</button>

</form>

<div class="copyright">

© 2026 NG Bathan Transport Services

<br>

All rights reserved.

</div>

</div>

</div>

</div>

</div>

<script src="js/script.js"></script>

</body>

</html>
